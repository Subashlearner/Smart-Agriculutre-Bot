<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroBot</title>
    <link rel="icon" href="favicon.jpg" type="image/png">
    <style>
        /* Body styling with agricultural theme */
        body {
            font-family: Arial, sans-serif;
            background-color: #eaf6e4; /* Light green background for a nature feel */
            color: #333;
            margin: 0;
            padding: 20px;
        }
        
        h1 {
            color: #2e7d32; /* Darker green for headings */
            margin-bottom: 10px;
        }

        .image-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px; /* More gap between images */
            max-width: 800px;
            margin: 20px auto;
        }
        
        .image-grid img {
            width: 180px;
            height: auto;
            border-radius: 8px;
            border: 2px solid #2e7d32; /* Green borders around images */
            transition: transform 0.3s, border-color 0.3s;
        }
        
        .image-grid img:hover {
            transform: scale(1.05); 
            border-color: #81c784; /* Lighter green border on hover */
        }

        /* Button styling */
        .controls {
            text-align: center;
            margin-top: 20px;
        }
        
        .controls button {
            font-size: 16px;
            padding: 12px 25px;
            margin: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
            box-shadow: 0 4px 8px rgba(46, 125, 50, 0.2); /* Shadow with green tint */
        }
        
        .controls button:hover {
            opacity: 0.85;
        }
        
        .controls .start-btn {
            background-color: #4caf50; /* A fresher green for start button */
            color: #fff;
        }
        
        .controls .stop-btn {
            background-color: #d32f2f; /* Deep red for stop button */
            color: #fff;
        }

        /* Additional content styling */
        .content {
            max-width: 800px;
            margin: 20px auto;
            padding: 15px;
            background-color: #f5fff0; /* Soft green for the content box */
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border: 1px solid #c8e6c9; /* Light green border */
            text-align: center;
            color: #4b5320; /* Earthy green for text */
        }
        
        .content p {
            font-size: 18px;
            line-height: 1.6;
            color: #555;
        }
    </style>
</head>
<body>
    <center>
        <h1>விவசாயிகளுக்கான தகவல் மற்றும் கண்காணிப்பு அமைப்பு</h1>
    </center>

    <div class="content">
        <p>விவசாயத்திற்கு உதவும் தகுந்த தகவல்களை இங்கே வழங்கியுள்ளோம். விதைகள், உரம், மண், வானிலை மற்றும் அரசு திட்டங்கள் போன்ற விவரங்களைப் பார்க்க, கீழே உள்ள உரிய படத்தைத் தொடுங்கள். "தொடங்கு" பட்டனை அழுத்தி, பின்னணி இசையை நன்கு அனுபவிக்கலாம்!</p>
    </div>

    <!-- Image Grid -->
    <div class="image-grid">
        <a href="seedpage.html">
            <img src="sample9.jpg" alt="விதைகள்">
        </a>
        <a href="fertilizerpage.html">
            <img src="sample4.jpg" alt="உரம்">
        </a>
        <!-- Scheme Image modified to play audio instead of linking to a page -->
        <img src="sample7.jpg" alt="அரசு திட்டங்கள்" onclick="playSchemeAudio()">
        <a href="soilpage.html">
            <img src="sample6.jpg" alt="மண்">
        </a>
        <a href="climatepage.html">
            <img src="sample2.jpg" alt="வானிலை">
        </a>
        <a href="voicepage.html">
            <img src="sample3.jpg" alt="குறள் உள்ளீடு">
        </a>
    </div>

    <!-- Background Audio Element with Start and Stop Controls -->
    <audio id="background-audio" loop>
        <source src="audio.mp3" type="audio/mpeg">
        உங்கள் உலாவி ஆடியோ தொகுப்பைப் பொறுத்திருக்கவில்லை.
    </audio>

    <!-- Scheme Audio Element -->
    <audio id="scheme-audio">
        <source src="sche.mp3" type="audio/mpeg">
        உங்கள் உலாவி ஆடியோ தொகுப்பைப் பொறுத்திருக்கவில்லை.
    </audio>

    <!-- Start and Stop Buttons for Background Audio -->
    <div class="controls">
        <button class="start-btn" onclick="startBackgroundAudio()">தொடங்கு</button>
        <button class="stop-btn" onclick="stopBackgroundAudio()">நிறுத்து</button>
    </div>

    <script>
        // Function to start playing background audio
        function startBackgroundAudio() {
            const backgroundAudio = document.getElementById('background-audio');
            const schemeAudio = document.getElementById('scheme-audio');

            // Stop scheme audio if playing
            schemeAudio.pause();
            schemeAudio.currentTime = 0;

            // Play background audio
            backgroundAudio.play();
        }

        // Function to stop background audio
        function stopBackgroundAudio() {
            const backgroundAudio = document.getElementById('background-audio');
            backgroundAudio.pause();
            backgroundAudio.currentTime = 0;
        }

        // Function to play scheme audio and stop background audio
        function playSchemeAudio() {
            const backgroundAudio = document.getElementById('background-audio');
            const schemeAudio = document.getElementById('scheme-audio');

            // Stop background audio if playing
            backgroundAudio.pause();
            backgroundAudio.currentTime = 0;

            // Play scheme audio
            schemeAudio.play();
        }
    </script>
</body>
</html>
